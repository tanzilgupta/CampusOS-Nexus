spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campusos}
spring.datasource.username=${DB_USERNAME:YOUR_DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:YOUR_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:REPLACE_WITH_A_BASE64_SECRET_OF_AT_LEAST_32_BYTES}
jwt.expiration=${JWT_EXPIRATION:86400000}
