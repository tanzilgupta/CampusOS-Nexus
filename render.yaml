services:
  # Spring Boot Backend API
  - type: web
    name: campusos-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DB_URL
        fromDatabase:
          name: campusos-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: campusos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: campusos-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000

  # Vite React Frontend
  - type: web
    name: campusos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: campusos-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: campusos-db
    plan: free
    databaseName: campusos
    user: campusos_user
